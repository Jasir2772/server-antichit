name: Build GuardianAC

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: GuardianAC.zip ni ochish (agar bo'lsa)
        run: |
          if [ -f GuardianAC.zip ]; then
            unzip -o GuardianAC.zip -d .
            echo "Zip ochildi."
          else
            echo "GuardianAC.zip topilmadi, GuardianAC papkasi allaqachon bor deb faraz qilinadi."
          fi

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Maven bilan build qilish
        run: mvn -f GuardianAC/pom.xml -B clean package

      - name: Jar faylni Artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: GuardianAC-jar
          path: GuardianAC/target/GuardianAC.jar
